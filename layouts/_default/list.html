{{ define "main" }}
<div class="container">
  <div style="text-align: center; margin-bottom: 4rem;">
    <h1 style="color: var(--accent-gold); font-size: 2.5rem; font-weight: 300; letter-spacing: 0.05em; margin-bottom: 0.5rem;">{{ .Title }}</h1>
    <p style="color: var(--text-muted); font-size: 1.1rem;">A curated numismatic study of ancient coinage.</p>
  </div>

  <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 2.5rem;">
    {{ range .Pages }}
      <div style="background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 4px; padding: 1.5rem; transition: transform 0.2s ease, border-color 0.2s ease;">
        {{ if .Params.obverse_image }}
          <div style="text-align: center; margin-bottom: 1.5rem; background: #000; padding: 1rem; border-radius: 4px;">
            <img src="{{ .Params.obverse_image }}" alt="{{ .Title }}" style="max-height: 200px; max-width: 100%; border-radius: 50%; object-fit: cover; box-shadow: 0 8px 20px rgba(0,0,0,0.6);">
          </div>
        {{ end }}
        <div style="font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--accent-gold); margin-bottom: 0.5rem;">
          {{ .Params.ruler }} &bull; {{ .Params.denomination }}
        </div>
        <h2 style="font-size: 1.25rem; margin: 0 0 1rem 0;">
          <a href="{{ .RelPermalink }}" style="color: var(--text-main); text-decoration: none;">{{ .Title }}</a>
        </h2>
        <a href="{{ .RelPermalink }}" style="display: inline-block; color: var(--accent-gold); text-decoration: none; font-size: 0.85srem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;">View Specimen &rarr;</a>
      </div>
    {{ end }}
  </div>
</div>
{{ end }}
